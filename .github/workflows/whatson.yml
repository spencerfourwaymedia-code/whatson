name: Costa Blanca WhatsOn Guide

on:
  schedule:
    - cron: '0 22 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Generate WhatsOn Bulletin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python scripts/generate_whatson.py

      - name: Upload Script
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatson-script
          path: whatson.txt
          if-no-files-found: ignore

      - name: Upload Audio
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatson-audio
          path: whatson.mp3
          if-no-files-found: ignore

      - name: Upload Debug HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: debug.html
          if-no-files-found: ignore

      - name: Update Event History
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add used_events.json

          git diff --cached --quiet || git commit -m "Update event history"

          git push
        continue-on-error: true
